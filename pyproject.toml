[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arcope"
dynamic = ["version"]
description = "Integration package bridging ARC crop parameter retrieval with SCOPE radiative transfer simulations"
readme = "README.md"
requires-python = ">=3.9,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Feng Yin", email = "ucfafyi@ucl.ac.uk" },
]
keywords = [
    "remote sensing",
    "crop monitoring",
    "radiative transfer",
    "sentinel-2",
    "SIF",
    "thermal",
    "SCOPE",
    "ARC",
    "fluorescence",
    "biophysical retrieval",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "xarray>=2023.1",
    "scipy>=1.11",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/MarcYin/ARCOPE"
Documentation = "https://marcyin.github.io/ARCOPE/"
Repository = "https://github.com/MarcYin/ARCOPE"
Issues = "https://github.com/MarcYin/ARCOPE/issues"
Changelog = "https://github.com/MarcYin/ARCOPE/releases"

[project.scripts]
# New primary names matching the PyPI distribution
arcope-dual-workflow = "arc_scope.experiments.dual_workflow:main"
arcope-full-run = "arc_scope.experiments.dual_workflow:main"
arcope-showcase = "arc_scope.experiments.showcase:main"
arcope-optimization-examples = "arc_scope.experiments.optimization_examples:main"
# Legacy aliases (kept for backwards compatibility)
arc-scope-dual-workflow = "arc_scope.experiments.dual_workflow:main"
arc-scope-full-run = "arc_scope.experiments.dual_workflow:main"
arc-scope-showcase = "arc_scope.experiments.showcase:main"
arc-scope-optimization-examples = "arc_scope.experiments.optimization_examples:main"

[project.optional-dependencies]
# ARC is hosted only on GitHub (not PyPI), so it cannot be listed as a
# direct URL dependency of a PyPI-published package. Users should install
# ARC separately with:
#   pip install git+https://github.com/MarcYin/ARC
scope = [
    "scope-rtm>=0.4.4",
    "torch>=2.2",
]
weather = [
    "cdsapi>=0.6",
]
optim = [
    "scope-rtm>=0.4.4",
    "torch>=2.2",
]
all = [
    "arcope[scope,weather,optim]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "build>=1.2",
    "twine>=5.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.7",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arc_scope = ["data/*.geojson", "data/*.csv"]

[tool.setuptools_scm]
fallback_version = "0.1.0"
version_scheme = "post-release"
local_scheme = "no-local-version"
